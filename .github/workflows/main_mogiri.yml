# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mogiri

# Azure の Gateway 版は、サーバーレス版への移行が終わるまで予備として凍結している（Node 18-lts）。
# main への push で予備が上書きされないよう、自動デプロイはしない。
# 予備を入れ直すときは、Actions の "Run workflow" でタグ azure-gateway-last-good を選んで実行する
# （main を選ぶと、Node 22 前提の今のコードがデプロイされてしまう）。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Decrypt secret
        run: /bin/sh ./.github/scripts/decrypt_secret.sh
        env:
          SECRET_PASSPHRASE: ${{ secrets.SECRET_PASSPHRASE }}

      - name: npm install, build, and test
        run: |
          npm ci --ignore-scripts
          npm audit signatures
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mogiri'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_70B7724D4A9B4777A75A3C7B2B0DD0BE }}
          package: .
